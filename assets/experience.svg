<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Experience timeline">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C83FF"/><stop offset="1" stop-color="#38E1D0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
</defs>
<rect x="0.5" y="0.5" width="1199" height="249" rx="18" fill="#0D1018" stroke="#1C2130"/>
<rect x="0.5" y="0.5" width="1199" height="249" rx="18" fill="url(#grid)"/>
<g transform="translate(0,20)">
<style>
  .rise { opacity:0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .draw { stroke-dasharray:1200; stroke-dashoffset:1200; animation: draw 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
  @keyframes draw { to { stroke-dashoffset:0 } }
</style>
<line x1="48" y1="40" x2="1150" y2="40" stroke="#1C2130" stroke-width="2"/>
<line x1="48" y1="40" x2="1150" y2="40" stroke="url(#accent)" stroke-width="2" class="draw"/>

  <g class="rise" style="animation-delay:0.20s">
    <circle cx="56.0" cy="40" r="8" fill="#07080D" stroke="#7C83FF" stroke-width="2"/>
    <circle cx="56.0" cy="40" r="3.5" fill="#7C83FF"/>
    <text x="48.0" y="84" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#4B5366" letter-spacing="1">JUN 2025 — JUL 2025</text>
    <text x="48.0" y="114" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F4F5F8">AI Intern</text>
    <text x="48.0" y="138" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#7C83FF">Prorigo Software Pvt. Ltd.</text>
    <text x="48.0" y="168" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8A93A6">Built a chat assistant that turns plain</text>
    <text x="48.0" y="188" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8A93A6">English into validated JSON configs.</text>
  </g>
  <g class="rise" style="animation-delay:0.45s">
    <circle cx="456.0" cy="40" r="8" fill="#07080D" stroke="#7C83FF" stroke-width="2"/>
    <circle cx="456.0" cy="40" r="3.5" fill="#7C83FF"/>
    <text x="448.0" y="84" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#4B5366" letter-spacing="1">MAR 2026 — APR 2026</text>
    <text x="448.0" y="114" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F4F5F8">Head of Logistics &amp; Marketing</text>
    <text x="448.0" y="138" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#7C83FF">Ignisia AI Club, MIT-WPU</text>
    <text x="448.0" y="168" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8A93A6">Ran marketing and logistics for a</text>
    <text x="448.0" y="188" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8A93A6">24-hour national-level hackathon.</text>
  </g>
  <g class="rise" style="animation-delay:0.70s">
    <circle cx="856.0" cy="40" r="8" fill="#07080D" stroke="#38E1D0" stroke-width="2"/>
    <circle cx="856.0" cy="40" r="3.5" fill="#38E1D0"/>
    <text x="848.0" y="84" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#4B5366" letter-spacing="1">APR 2026 — OCT 2026</text>
    <text x="848.0" y="114" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#F4F5F8">Head of Events &amp; Operations</text>
    <text x="848.0" y="138" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#7C83FF">Ignisia AI Club, MIT-WPU</text>
    <text x="848.0" y="168" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8A93A6">Led the events department and shipped</text>
    <text x="848.0" y="188" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#8A93A6">EMS, the club's election platform.</text>
  </g>
</g>
</svg>
