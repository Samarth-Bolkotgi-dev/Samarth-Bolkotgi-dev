    <stop offset="0" stop-color="#7C83FF"/><stop offset="1" stop-color="#38E1D0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>

  <radialGradient id="glowA" cx="0.82" cy="0.25" r="0.55"><stop offset="0" stop-color="#7C83FF" stop-opacity="0.28"/><stop offset="1" stop-color="#7C83FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#38E1D0" stop-opacity="0.14"/><stop offset="1" stop-color="#38E1D0" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1200" height="380" rx="20"/></clipPath>
</defs>
<style>
  .edge { stroke:url(#accent); stroke-width:1.2; stroke-opacity:.18; animation: pulse 3s ease-in-out infinite; }
  .node { fill:#0D1018; stroke:#7C83FF; stroke-width:1.6; animation: glow 3.2s ease-in-out infinite; }
  .rise { opacity:0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  .live { animation: live 2s ease-out infinite; transform-origin: 1018px 22px; }
  @keyframes pulse { 0%,100% { stroke-opacity:.12 } 50% { stroke-opacity:.6 } }
  @keyframes glow { 0%,100% { fill:#0D1018 } 50% { fill:#7C83FF } }
  @keyframes rise { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
  @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
  @keyframes live { 0% { transform:scale(1); opacity:.7 } 100% { transform:scale(2.6); opacity:0 } }
</style>
