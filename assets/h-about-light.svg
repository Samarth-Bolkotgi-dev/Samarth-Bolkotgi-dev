<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="About">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C83FF"/><stop offset="1" stop-color="#38E1D0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>

  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C83FF" stop-opacity=".6"/><stop offset="1" stop-color="#38E1D0" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .draw { stroke-dasharray:900; stroke-dashoffset:900; animation: draw 1.6s cubic-bezier(.2,.7,.2,1) .2s forwards; }
  @keyframes draw { to { stroke-dashoffset:0 } }
</style>
<text x="4" y="40" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="600" fill="url(#accent)">01</text>
<text x="44" y="42" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" fill="#0B0D14" letter-spacing="-0.6">About</text>
<text x="150" y="41" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#8A93A6">// whoami</text>
<line x1="4" y1="60" x2="1196" y2="60" stroke="#E3E6EE"/>
<line x1="4" y1="60" x2="900" y2="60" stroke="url(#fade)" stroke-width="2" class="draw"/>
</svg>
